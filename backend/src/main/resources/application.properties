server.port=${PORT:8080}
# Fuso horário: Brasília (UTC-3)
server.servlet.default-timezone=America/Sao_Paulo

# SMTP Office 365 - UNESPAR
spring.mail.host=smtp.office365.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dev@local}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# E-mail de destino dos registros do diário
frota.email.destino=juscelino.junior@unespar.edu.br

# CORS
frota.cors.origins=${CORS_ORIGINS:*}

# Banco de dados (PostgreSQL em produção, H2 em memória localmente)
spring.datasource.url=${DB_URL:jdbc:h2:mem:frotadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Schema dedicado em produção (Neon.tech)
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:}
# Serializa datas como string ISO-8601 (não como array de números)
spring.jackson.serialization.write-dates-as-timestamps=false

# Admin - Azure AD
frota.azure.tenant-id=${AZURE_TENANT_ID:25578206-8f9a-4e3b-a498-91b736511438}
frota.azure.client-id=${AZURE_CLIENT_ID:0d704c7a-f95c-4d6c-bf2d-042d8fc0265e}
frota.admin.email=${ADMIN_EMAIL:informatica.curitiba2@unespar.edu.br}
frota.admin.email2=${ADMIN_EMAIL2:frota.app@unespar.edu.br}

# Segredo para assinar tokens JWT internos (mínimo 32 caracteres)
frota.jwt.secret=${JWT_SECRET:frota-unespar-secret-key-2025-dev}
